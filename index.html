<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshack | Command Center</title>
    <style>
        :root {
            --bg-deep: #05070b;
            --surface-glass: rgba(13, 17, 23, 0.65);
            --border-glow: rgba(0, 242, 254, 0.25);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Flowing Edge Neon Lights */
        .ambient-glow {
            position: fixed;
            top: 0; bottom: 0;
            width: 200px;
            filter: blur(100px);
            opacity: 0.3;
            z-index: 1;
            pointer-events: none;
            animation: driftLights 12s ease-in-out infinite alternate;
        }
        .ambient-left {
            left: -80px;
            background: linear-gradient(135deg, #059669, #3b82f6, #8b5cf6);
        }
        .ambient-right {
            right: -80px;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4, #059669);
            animation-delay: -6s;
        }

        @keyframes driftLights {
            0% { transform: translateY(-30px) scale(0.95); opacity: 0.25; }
            50% { transform: translateY(30px) scale(1.05); opacity: 0.4; }
            100% { transform: translateY(-30px) scale(0.95); opacity: 0.25; }
        }

        /* Floating Background Particles */
        .particles {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp 8s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Centered Luxury Glassmorphism Card */
        .command-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 
                        0 0 30px rgba(5, 150, 105, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Decorative Status Line */
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .status-dot {
            width: 6px; height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }
        .status-text {
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #10b981;
            text-transform: uppercase;
        }

        /* Gradient Typography for Meshack */
        .brand-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #3b82f6 70%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 500;
        }

        /* Futuristic CTA Button */
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #065f46 0%, #059669 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 14px;
            border: 1px solid rgba(52, 211, 153, 0.4);
            box-shadow: 0 8px 25px rgba(5, 150, 105, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(5, 150, 105, 0.6);
            border-color: rgba(52, 211, 153, 0.8);
        }

        .cta-button:hover::after {
            left: 100%;
        }

        .cta-icon {
            transition: transform 0.3s ease;
        }
        .cta-button:hover .cta-icon {
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <div class="ambient-glow ambient-left"></div>
    <div class="ambient-glow ambient-right"></div>

    <div class="particles" id="particles"></div>

    <div class="command-card">
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span class="status-text">System Operational</span>
        </div>

        <h1 class="brand-title">Meshack</h1>
        <p class="brand-subtitle">Main Command Center</p>

        <a href="creativity.html" class="cta-button">
            <span>Enter Creativity Hub</span>
            <span class="cta-icon">→</span>
        </a>
    </div>

    <script>
        // Generate Floating Background Particles Dynamically
        const particlesContainer = document.getElementById('particles');
        const particleCount = 18;

        for (let i = 0; i < particleCount; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 3 + 1;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 6 + 5) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
