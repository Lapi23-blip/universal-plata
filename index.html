<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Question for Tracy</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 20px; padding: 0 20px; }
        .image-container img {
            width: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }
        .btn-container { position: relative; width: 100%; height: 100px; }
        button {
            font-size: 18px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
        }
        #yesBtn { background-color: #4CAF50; color: white; margin-right: 20px; }
        #noBtn { background-color: #f44336; color: white; position: absolute; }
        #datePickerContainer { display: none; margin-top: 30px; }
        input[type="date"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin-bottom: 15px;
        }
        #submitDate {
            background-color: #2196F3;
            color: white;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <!-- ⚠️ CHANGE THIS ⚠️: Replace the link inside src="..." with a link to an image of you, or a meme. -->
        <img src="https://images.unsplash.com/photo-1518192167132-849495447b85?w=400&q=80" alt="Placeholder">
    </div>

    <h1>Will you go on a date with me tracy👻</h1>

    <div class="btn-container" id="action-buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <div id="datePickerContainer">
        <h3>Perfect. Pick a day:</h3>
        <input type="date" id="dateInput">
        <button id="submitDate">Confirm</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const datePicker = document.getElementById('datePickerContainer');
        const actionButtons = document.getElementById('action-buttons');
        const submitDate = document.getElementById('submitDate');

        noBtn.style.left = "55%";
        yesBtn.style.position = "absolute";
        yesBtn.style.left = "25%";

        function evadeTapping() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const maxX = window.innerWidth - btnWidth - 20;
            const maxY = window.innerHeight - btnHeight - 20;

            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', evadeTapping);
        noBtn.addEventListener('touchstart', evadeTapping);

        yesBtn.addEventListener('click', () => {
            actionButtons.style.display = 'none';
            noBtn.style.display = 'none';
            datePicker.style.display = 'block';
        });

        submitDate.addEventListener('click', () => {
            const selectedDate = document.getElementById('dateInput').value;
            if(!selectedDate) {
                alert("Pick a date first.");
                return;
            }
            
            // ⚠️ CHANGE THIS ⚠️: Put your actual WhatsApp number below. Start with 254 (No '+' sign, no spaces).
            const yourPhoneNumber = "254799611634"; 
            
            const message = encodeURIComponent(`I picked ${selectedDate} for our date 👻`);
            window.location.href = `https://wa.me/${yourPhoneNumber}?text=${message}`;
        });
    </script>
</body>
</html>
