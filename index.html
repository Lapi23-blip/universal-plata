<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Question for Tracy</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 30px;
            color: #ffffff;
            line-height: 1.4;
        }
        .btn-container {
            position: relative;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button {
            font-size: 16px;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, left 0.3s ease-out, top 0.3s ease-out;
        }
        #yesBtn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
            position: absolute;
            left: 15%;
        }
        #noBtn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
            position: absolute;
            left: 55%;
            z-index: 10;
        }
        #datePickerContainer {
            display: none;
            width: 100%;
        }
        #datePickerContainer h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #f1f1f1;
        }
        input[type="date"] {
            padding: 12px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.9);
            color: #222;
            margin-bottom: 15px;
            width: 90%;
            outline: none;
            font-weight: 600;
        }
        #submitDate {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Will you go on a date with me tracy👻</h1>

        <div class="btn-container" id="action-buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>

        <div id="datePickerContainer">
            <h3>Perfect. Pick a day:</h3>
            <input type="date" id="dateInput">
            <button id="submitDate">Confirm</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const datePicker = document.getElementById('datePickerContainer');
        const actionButtons = document.getElementById('action-buttons');
        const submitDate = document.getElementById('submitDate');

        function evadeTapping(e) {
            if(e.type === 'touchstart') e.preventDefault();

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const padding = 50;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', evadeTapping);
        noBtn.addEventListener('touchstart', evadeTapping);

        yesBtn.addEventListener('click', () => {
            actionButtons.style.display = 'none';
            noBtn.style.display = 'none';
            datePicker.style.display = 'block';
        });

        submitDate.addEventListener('click', () => {
            const selectedDate = document.getElementById('dateInput').value;
            if(!selectedDate) {
                alert("Pick a date first.");
                return;
            }
            
            // Replace with your real phone number starting with country code 254
            const yourPhoneNumber = "254799611634"; 
            
            const message = encodeURIComponent(`I picked ${selectedDate} for our date 👻`);
            window.location.href = `https://wa.me/${yourPhoneNumber}?text=${message}`;
        });
    </script>
</body>
</html>
