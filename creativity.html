<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshack | Static CD Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Static 90s Holographic Silver CD Badge */
        #static-cd {
            width: 90px; height: 90px;
            background: radial-gradient(circle, #222 30%, transparent 31%),
                        linear-gradient(135deg, #d4d4d4 0%, #ffffff 35%, #888 50%, #f0f0f0 75%, #555 100%);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), inset 0 0 10px rgba(0,0,0,0.6);
            margin: 0 auto 15px auto;
            border: 2px solid rgba(255,255,255,0.6);
        }
        #static-cd::after {
            content: '';
            width: 22px; height: 22px;
            background: #010409;
            border-radius: 50%;
            border: 2px solid #aaa;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.9);
        }
        .search-box-container {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .search-input {
            width: 70%;
            padding: 8px;
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            font-family: monospace;
            outline: none;
        }
        .search-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 6px;
            font-family: monospace;
            cursor: pointer;
        }
        .search-btn:hover { background: #2ea043; }
        .results-list {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }
        .result-item {
            background: #161b22;
            padding: 6px 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            color: #58a6ff;
            font-family: monospace;
            border: 1px solid #30363d;
        }
        .result-item:hover { background: #30363d; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div id="static-cd"></div>

        <span class="badge">SYSTEM ONLINE</span>
        <h1>Meshack Command</h1>
        <p>Search any song and play it with a stationary CD badge.</p>
        
        <div id="live-clock" style="font-family: monospace; color: #3fb950; margin-bottom: 15px; font-size: 0.9rem;">Initializing clock...</div>

        <div class="search-box-container">
            <p style="color: #c9d1d9; font-size: 0.85rem; margin-bottom: 10px;">Search any song... 😊</p>
            <input type="text" id="query-input" class="search-input" placeholder="e.g. Worth It Don Toliver">
            <button class="search-btn" onclick="searchSongs()">Search</button>
            <div id="search-results" class="results-list"></div>
        </div>

        <audio id="audio-elem" controls class="audio-player"></audio>

        <div class="terminal-box" style="background: #010409; border: 1px solid #30363d; padding: 10px; border-radius: 6px; text-align: left; font-size: 0.75rem; color: #8b949e; height: 50px; overflow: hidden; margin-top: 15px; font-family: monospace;"><span style="color: #58a6ff;">sys@meshack:~#</span> <span id="log-text">Awaiting search query...</span></div>

        <a href="index.html" class="nav-btn secondary" style="margin-top: 15px; display: block;">Back to Home</a>
    </div>

    <script>
        function updateClock() {
            document.getElementById('live-clock').innerText = 'UTC: ' + new Date().toUTCString().slice(17, 25);
        }
        setInterval(updateClock, 1000); updateClock();

        const audio = document.getElementById('audio-elem');
        const cd = document.getElementById('static-cd');

        async function searchSongs() {
            const query = document.getElementById('query-input').value;
            document.getElementById('log-text').innerText = 'Searching global database...';
            
            try {
                let response = await fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(query) + '&media=music&limit=5');
                let data = await response.json();
                let resultsDiv = document.getElementById('search-results');
                resultsDiv.innerHTML = '';

                if(data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="result-item">No tracks found. Try another search.</div>';
                    return;
                }

                data.results.forEach(song => {
                    let div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = '💿 ' + song.trackName + ' - ' + song.artistName;
                    div.onclick = () => {
                        audio.src = song.previewUrl;
                        audio.play();
                        document.getElementById('log-text').innerText = 'Playing: ' + song.trackName + ' by ' + song.artistName + ' 💿';
                    };
                    resultsDiv.appendChild(div);
                });
            } catch(e) {
                document.getElementById('log-text').innerText = 'Search error occurred.';
            }
        }

        audio.onplay = () => { cd.style.display = 'flex'; };
        audio.onpause = audio.onended = () => { cd.style.display = 'none'; };
    </script>
</body>
</html>
