<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshack | 90s CD Screen-Saver</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Authentic 90s Holographic Silver CD */
        #bouncing-cd {
            position: fixed;
            top: 0; left: 0;
            width: 90px; height: 90px;
            background: radial-gradient(circle, #222 30%, transparent 31%),
                        linear-gradient(135deg, #d4d4d4 0%, #ffffff 35%, #888 50%, #f0f0f0 75%, #555 100%);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), inset 0 0 10px rgba(0,0,0,0.6);
            z-index: 9999;
            pointer-events: none;
            border: 2px solid rgba(255,255,255,0.6);
        }
        /* Center Spindle Hole of the CD */
        #bouncing-cd::after {
            content: '';
            width: 22px; height: 22px;
            background: #010409;
            border-radius: 50%;
            border: 2px solid #aaa;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.9);
        }

        /* Song Selector Prompt Box */
        .song-prompt {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .song-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 6px;
            font-family: monospace;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .song-btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div id="bouncing-cd"></div>

    <div class="card">
        <span class="badge">SYSTEM ONLINE</span>
        <h1>Meshack Command</h1>
        <p>Select your track and trigger the 90s CRT screen-saver.</p>
        
        <div id="live-clock" style="font-family: monospace; color: #3fb950; margin-bottom: 15px; font-size: 0.9rem;">Initializing clock...</div>

        <div class="song-prompt">
            <p style="color: #c9d1d9; font-size: 0.85rem; margin-bottom: 10px;">Which song do you want? 😊</p>
            <button class="song-btn" onclick="selectTrack('worth-it.mp3', 'WORTH IT (Offset & Don Toliver)')">1. Worth It</button>
            <button class="song-btn" onclick="selectTrack('offset.mp3', '2. Alternate Track')">2. Alternate Track</button>
        </div>

        <audio id="audio-elem" controls class="audio-player"></audio>

        <div class="terminal-box" style="background: #010409; border: 1px solid #30363d; padding: 10px; border-radius: 6px; text-align: left; font-size: 0.75rem; color: #8b949e; height: 50px; overflow: hidden; margin-top: 15px; font-family: monospace;"><span style="color: #58a6ff;">sys@meshack:~#</span> <span id="log-text">Waiting for track selection...</span></div>

        <a href="index.html" class="nav-btn secondary" style="margin-top: 15px; display: block;">Back to Home</a>
    </div>

    <script>
        function updateClock() {
            document.getElementById('live-clock').innerText = 'UTC: ' + new Date().toUTCString().slice(17, 25);
        }
        setInterval(updateClock, 1000); updateClock();

        const audio = document.getElementById('audio-elem');
        const cd = document.getElementById('bouncing-cd');
        let x = 50, y = 50, vx = 3.5, vy = 3, id = null;

        function selectTrack(filename, title) {
            audio.src = filename;
            audio.play().then(() => {
                document.getElementById('log-text').innerText = 'Playing: ' + title + ' 💿';
            }).catch(e => {
                document.getElementById('log-text').innerText = 'Playback error: check file.';
            });
        }

        function startBouncing() {
            cd.style.display = 'flex';
            function frame() {
                const maxX = window.innerWidth - cd.clientWidth;
                const maxY = window.innerHeight - cd.clientHeight;
                x += vx; y += vy;
                if (x <= 0 || x >= maxX) vx *= -1;
                if (y <= 0 || y >= maxY) vy *= -1;
                cd.style.left = x + 'px';
                cd.style.top = y + 'px';
                id = requestAnimationFrame(frame);
            }
            frame();
        }

        function stopBouncing() {
            cancelAnimationFrame(id);
            cd.style.display = 'none';
        }

        audio.onplay = () => { startBouncing(); };
        audio.onpause = audio.onended = () => { stopBouncing(); };
    </script>
</body>
</html>
