<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshack | Cinematic Audio Streamer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-deep: #0a0c10;
            --surface-glass: rgba(18, 22, 31, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-green: #2ea043;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Animated Side Neon Lights */
        .ambient-light {
            position: fixed;
            top: 0; bottom: 0;
            width: 180px;
            filter: blur(90px);
            opacity: 0.35;
            z-index: 1;
            pointer-events: none;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }
        .ambient-left {
            left: -60px;
            background: linear-gradient(135deg, #7928ca, #4f46e5, #00f2fe);
        }
        .ambient-right {
            right: -60px;
            background: linear-gradient(135deg, #2ea043, #00f2fe, #7928ca);
            animation-delay: -5s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translateY(0); opacity: 0.25; }
            50% { transform: scale(1.1) translateY(-20px); opacity: 0.45; }
            100% { transform: scale(1) translateY(0); opacity: 0.25; }
        }

        /* Cinematic Glass Container */
        .player-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            margin: 20px;
            text-align: center;
        }

        /* Top System Status */
        .system-badge {
            display: inline-block;
            font-family: monospace;
            font-size: 0.7rem;
            color: #3fb950;
            background: rgba(46, 160, 67, 0.12);
            border: 1px solid rgba(46, 160, 67, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Album Artwork Box */
        .artwork-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 20px auto;
            border-radius: 16px;
            overflow: hidden;
            background: #161b22;
            border: 1px solid var(--border-glass);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .artwork-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .artwork-wrapper:hover img { transform: scale(1.03); }
        .artwork-placeholder {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: monospace;
        }

        /* Song Metadata */
        .song-info {
            margin-bottom: 25px;
        }
        #song-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #artist-name {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Custom Track Selector (For Local Full-Length Files) */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .search-input {
            flex: 1;
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #58a6ff; }
        .search-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover { background: #2ea043; }

        /* Track Results List */
        .results-container {
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 20px;
            text-align: left;
            border-radius: 8px;
        }
        .result-row {
            background: rgba(22, 27, 34, 0.5);
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            font-size: 0.78rem;
            color: #58a6ff;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-row:hover {
            background: rgba(48, 54, 61, 0.8);
            border-color: var(--border-glass);
            color: #fff;
        }

        /* Modern Audio Element Styling */
        .audio-player-box {
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            accent-color: #2ea043;
            filter: invert(0.9) hue-rotate(180deg);
        }

        /* Terminal Console Log */
        .console-box {
            background: #010409;
            border: 1px solid var(--border-glass);
            padding: 10px 12px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--text-muted);
            margin-bottom: 20px;
            overflow: hidden;
            height: 42px;
        }
        .console-prefix { color: #58a6ff; }

        /* Navigation Button */
        .nav-link {
            display: block;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .nav-link:hover { background: rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body>

    <div class="ambient-light ambient-left"></div>
    <div class="ambient-light ambient-right"></div>

    <div class="player-container">
        <div class="system-badge">SYSTEM ONLINE</div>

        <div class="artwork-wrapper" id="art-wrap">
            <span class="artwork-placeholder">FULL AUDIO READY</span>
            <img id="album-art" src="" alt="Cover" style="display:none;">
        </div>

        <div class="song-info">
            <div id="song-title">Worth It (Full Track)</div>
            <div id="artist-name">Offset & Don Toliver</div>
        </div>

        <div class="search-box">
            <input type="text" id="query-input" class="search-input" placeholder="Type filename e.g. worth-it.mp3">
            <button class="search-btn" onclick="loadLocalTrack()">Load</button>
        </div>

        <div id="search-results" class="results-container">
            <div class="result-row" onclick="playPreset('worth-it.mp3', 'Worth It', 'Offset & Don Toliver')">💿 Play Local: Worth It (Full Track)</div>
        </div>

        <div class="audio-player-box">
            <audio id="audio-elem" controls src="worth-it.mp3"></audio>
        </div>

        <div class="console-box">
            <span class="console-prefix">sys@meshack:~#</span> <span id="log-text">Full duration engine active. Ready to play.</span>
        </div>

        <a href="index.html" class="nav-link">Back to Home</a>
    </div>

    <script>
        const audio = document.getElementById('audio-elem');
        const artWrap = document.getElementById('art-wrap');
        const albumArt = document.getElementById('album-art');
        const placeholder = artWrap.querySelector('.artwork-placeholder');
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const logText = document.getElementById('log-text');

        // Ensure audio element loads full metadata without restrictions
        audio.preload = "auto";

        function playPreset(filename, title, artist) {
            audio.src = filename;
            audio.load();
            audio.play().then(() => {
                songTitle.innerText = title;
                artistName.innerText = artist;
                logText.innerText = 'Playing full duration: ' + title;
            }).catch(e => {
                logText.innerText = 'Error: Check if ' + filename + ' exists in repository.';
            });
        }

        function loadLocalTrack() {
            const filename = document.getElementById('query-input').value.trim();
            audio.src = filename;
            audio.load();
            audio.play().then(() => {
                songTitle.innerText = filename;
                artistName.innerText = 'Local Storage Stream';
                logText.innerText = 'Streaming full file: ' + filename;
            }).catch(e => {
                logText.innerText = 'File not found in project folder.';
            });
        }

        // Automatically monitor actual file duration when metadata loads
        audio.onloadedmetadata = () => {
            const durationMinutes = Math.floor(audio.duration / 60);
            const durationSeconds = Math.floor(audio.duration % 60).toString().padStart(2, '0');
            logText.innerText = 'Duration detected: ' + durationMinutes + ':' + durationSeconds + ' (Full track unlocked)';
        };

        audio.onplay = () => {
            logText.innerText = 'Playback active from start to finish.';
        };
    </script>
</body>
</html>
