<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshack | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Arena for the bouncing animation */
        #bounce-arena {
            position: relative;
            width: 100%;
            height: 140px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
        }
        /* The CD / Album cover element */
        #bouncing-cover {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #58a6ff, #238636);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
            display: none; /* Hidden until play starts */
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">SYSTEM ONLINE</span>
        <h1>Meshack Command</h1>
        <p>Edge node active. Telemetry running live from Kenya.</p>
        
        <!-- Live Clock Widget -->
        <div id="live-clock" style="font-family: monospace; color: #3fb950; margin-bottom: 15px; font-size: 0.9rem;">
            Initializing clock...
        </div>

        <!-- Audio Player with Event Listeners -->
        <audio id="audio-elem" controls class="audio-player">
            <source src="soundtrack.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <!-- Bouncing Screen Arena -->
        <div id="bounce-arena">
            <div id="bouncing-cover">CD</div>
        </div>

        <!-- Dynamic Terminal Log -->
        <div class="terminal-box" style="background: #010409; border: 1px solid #30363d; padding: 10px; border-radius: 6px; text-align: left; font-size: 0.75rem; color: #8b949e; height: 50px; overflow: hidden; margin-top: 15px; font-family: monospace;">
            <span style="color: #58a6ff;">sys@meshack:~#</span> <span id="log-text">Awaiting audio playback...</span>
        </div>

        <a href="index.html" class="nav-btn secondary" style="margin-top: 15px; display: block;">Back to Home</a>
    </div>

    <script>
        // Real-time clock update
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = "UTC: " + now.toUTCString().slice(17, 25);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Bouncing DVD Logic
        const audio = document.getElementById('audio-elem');
        const cover = document.getElementById('bouncing-cover');
        const arena = document.getElementById('bounce-arena');

        let posX = 20, posY = 20;
        let velX = 2, velY = 1.5;
        let animationId = null;

        function startBouncing() {
            cover.style.display = 'flex';
            function frame() {
                const maxX = arena.clientWidth - cover.clientWidth;
                const maxY = arena.clientHeight - cover.clientHeight;

                posX += velX;
                posY += velY;

                if (posX <= 0 || posX >= maxX) {
                    velX *= -1;
                    flashLog("CD hit boundary! Redirecting vector.");
                }
                if (posY <= 0 || posY >= maxY) {
                    velY *= -1;
                    flashLog("CD hit boundary! Redirecting vector.");
                }

                cover.style.left = posX + 'px';
                cover.style.top = posY + 'px';

                animationId = requestAnimationFrame(frame);
            }
            frame();
        }

        function stopBouncing() {
            cancelAnimationFrame(animationId);
            cover.style.display = 'none';
        }

        audio.onplay = () => {
            document.getElementById('log-text').innerText = "Audio stream active: CD trajectory launched.";
            startBouncing();
        };

        audio.onpause = () => {
            document.getElementById('log-text').innerText = "Audio paused. CD stationary.";
            stopBouncing();
        };

        audio.onended = () => {
            document.getElementById('log-text').innerText = "Playback finished.";
            stopBouncing();
        };

        function flashLog(msg) {
            document.getElementById('log-text').innerText = msg;
        }
    </script>
</body>
</html>
